# Paste this under "services:" in your docker-compose.yml
# (same indentation as payment-service and notification-service)

  ledger-service:
    build: ./ledger-service
    ports:
      - "8083:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
